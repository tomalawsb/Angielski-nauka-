<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Testy Angielski Daily Trainer 6.6.0</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:20px;background:#f4f7fb;color:#172033}main{max-width:1040px;margin:auto}.grid{display:grid;grid-template-columns:minmax(320px,390px) 1fr;gap:20px}iframe{width:100%;height:760px;border:1px solid #ccd5e2;border-radius:18px;background:#fff}.result{padding:9px 12px;margin:7px 0;border-radius:10px;background:#fff}.pass{border-left:5px solid #16a34a}.fail{border-left:5px solid #dc2626}@media(max-width:780px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Testy przeglądarkowe v6.6.0</h1>
  <p id="summary">Uruchamianie testów…</p>
  <div class="grid"><iframe id="app" title="Testowana aplikacja" src="../index.html?app=6.6.0&test=1"></iframe><section id="results" aria-live="polite"></section></div>
</main>
<script>
'use strict';
const frame=document.getElementById('app'),results=document.getElementById('results'),summary=document.getElementById('summary');
function add(name,ok,detail=''){const row=document.createElement('div');row.className='result '+(ok?'pass':'fail');row.textContent=(ok?'PASS: ':'FAIL: ')+name+(detail?' — '+detail:'');results.appendChild(row);return ok;}
frame.addEventListener('load',()=>setTimeout(()=>{
  const w=frame.contentWindow,d=w.document,T=w.__trainerTests;let passed=0,total=0;
  const test=(name,condition,detail='')=>{total++;if(add(name,!!condition,detail))passed++;};
  try{
    test('aplikacja uruchamia się bez błędu',!!T&&!d.getElementById('errorBox').textContent);
    test('wersja programu to 6.6.0',d.body.textContent.includes('6.6.0'));
    test('wersja treści jest widoczna',d.body.textContent.includes('a1-a2-2026.07-r1'));
    test('baza ma 1713 materiałów',T.WORDS.length===1713,String(T.WORDS.length));
    test('każdy materiał ma przykład',T.WORDS.every(x=>x.examples?.some(e=>e.en&&e.pl)));
    const exampleKeys=T.WORDS.flatMap(x=>(x.examples||[]).map(e=>T.normalize(e.en+'|'+e.pl)));
    test('przykłady są unikalne',new Set(exampleKeys).size===exampleKeys.length);
    test('katalog przechodzi walidację',T.courseCatalogStatus().valid,T.courseCatalogStatus().errors?.[0]||'');
    test('katalog ma stabilną wersję Pakietu 8',T.COURSE_CATALOG.catalogVersion==='2026.07-a1-a2-stable-p8');
    test('kurs ma 24 moduły',T.COURSE_CATALOG.levels.flatMap(x=>x.modules||[]).filter(x=>x.status==='published').length===24);
    test('kurs ma 115 lekcji',T.publishedCourseLessons().length===115,String(T.publishedCourseLessons().length));
    test('A1 ma 55 lekcji',T.publishedCourseLessons().filter(x=>x.level==='A1').length===55);
    test('A2 ma 60 lekcji',T.publishedCourseLessons().filter(x=>x.level==='A2').length===60);
    test('baza ma 145 scen dialogowych',Object.keys(T.DIALOGUE_SCENES).length===145);
    test('walidator semantyczny obejmuje 55 lekcji A2',Object.keys(T.A2_SEMANTIC_VALIDATORS||{}).length===55);
    test('pisownia brytyjska i amerykańska jest równoważna',T.answerScore('My favourite colour is grey.','My favorite color is gray.').status==='correct');
    test('zły szyk nie jest zaliczany',T.answerScore('router the restart I','I restart the router').status==='wrong');
    test('dolne menu ma cztery pozycje',d.querySelectorAll('.bottomnav .nav').length===4);
    test('jest odsyłacz do głównej treści',!!d.querySelector('.skip-link[href="#mainContent"]'));
    test('ustawienia mają siedem sekcji',d.querySelectorAll('#settingsScreen .settings-section').length===7);
    test('jest pobieranie kopii JSON',!!d.getElementById('exportBtn')&&!!d.getElementById('prepareExportBtn'));
    test('jest wybór pliku JSON',d.getElementById('importFileInput')?.accept==='application/json,.json');
    const backup=JSON.parse(T.exportPayload());
    test('kopia ma wersję programu',backup.version==='6.6.0');
    test('kopia ma wersję treści',backup.contentVersion==='a1-a2-2026.07-r1');
    const migrated=T.validateImportedState(JSON.stringify({version:'6.5.0'}));
    test('import 6.5.0 migruje do 6.6.0',migrated.version==='6.6.0');
    test('informacje zawierają politykę prywatności',d.getElementById('infoScreen').textContent.includes('Polityka prywatności'));
    test('informacje wyjaśniają użycie mikrofonu',d.getElementById('infoScreen').textContent.includes('nie zapisuje plików dźwiękowych'));
    test('ostrzeżenie samochodowe zabrania obsługi telefonu',d.getElementById('carWarningDialog').textContent.includes('nie obsługuj telefonu'));
    test('pomoc opisuje warianty pisowni',d.getElementById('helpScreen').textContent.includes('colour/color'));
    test('pierwsza lekcja A1 jest dostępna',T.canStartCourseLesson('a1-m01-l01'));
    test('pierwsza lekcja A2 jest dostępna',T.canStartCourseLesson('a2-m01-l01'));
  }catch(error){add('wykonanie zestawu testów',false,error.message);total++;}
  summary.textContent=`Wynik: ${passed}/${total}`;summary.style.fontWeight='800';summary.style.color=passed===total?'#166534':'#991b1b';
},900));
</script></body></html>
