<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testy v5.5.0</title><body style="font-family:system-ui;padding:20px;background:#f8fafc"><h1>Testy v5.5.0</h1><pre id="out">Start...</pre><iframe id="app" src="index.html?v=5.5.0" style="width:390px;height:700px;border:1px solid #ddd"></iframe><script>
const out=document.getElementById('out'); const f=document.getElementById('app');
f.onload=()=>setTimeout(()=>{try{const w=f.contentWindow; const T=w.__trainerTests; const tests=[['baza rozszerzona',T.WORDS.length>=420],['jest tryb mówienia',typeof T.modeLabel==='function'&&T.modeLabel('speaking')==='mówienie'],['jest tryb dialog',typeof T.modeLabel==='function'&&T.modeLabel('dialogue')==='dialog'],['literówka chargre',T.isCloseEnough('chargre','charger')===true],['dog/dig nie przechodzi',T.isCloseEnough('dog','dig')===false],['data lokalna format',/^\d{4}-\d{2}-\d{2}$/.test(T.todayKey())]]; const fail=tests.filter(x=>!x[1]).length; out.textContent=tests.map(x=>(x[1]?'✅ ':'❌ ')+x[0]).join('\n')+'\n\nWynik: '+(tests.length-fail)+'/'+tests.length+' OK';}catch(e){out.textContent='Błąd testów: '+e.message;}},500);
</script></body></html>
