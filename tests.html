<script>
(() => {
  const out = document.getElementById('out');
  const t = window.__trainerTests;
  const tests = [
    ['normalizacja polskich znaków', t.normalize(' ŻÓŁĆ! ') === 'zołc' || t.normalize(' ŻÓŁĆ! ') === 'zolc'],
    ['identyczna odpowiedź', t.isCloseEnough('charger', 'charger') === true],
    ['literówka z przestawieniem liter', t.isCloseEnough('chargre', 'charger') === true],
    ['krótkie inne słowo nie przechodzi', t.isCloseEnough('dog', 'dig') === false],
    ['inna odpowiedź nie przechodzi', t.isCloseEnough('battery', 'router') === false],
    ['data lokalna ma format YYYY-MM-DD', /^\d{4}-\d{2}-\d{2}$/.test(t.todayKey(new Date()))],
    ['domyślny stan ma ustawienia', !!t.defaultState().settings.dailyNew]
  ];
  const failed = tests.filter(([, ok]) => !ok).length;
  out.innerHTML = tests.map(([name, ok]) => `${ok ? '✅' : '❌'} ${name}`).join('\n') + `\n\nWynik: ${tests.length - failed}/${tests.length} OK`;
  out.className = failed ? 'bad' : 'ok';
})();
</script>
