<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Testy Angielski Daily Trainer 5.8.2</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:20px;background:#f4f7fb;color:#172033}main{max-width:980px;margin:auto}.grid{display:grid;grid-template-columns:minmax(320px,390px) 1fr;gap:20px}iframe{width:100%;height:760px;border:1px solid #ccd5e2;border-radius:18px;background:#fff}.result{padding:9px 12px;margin:7px 0;border-radius:10px;background:#fff}.pass{border-left:5px solid #16a34a}.fail{border-left:5px solid #dc2626}@media(max-width:780px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>Testy przeglądarkowe v5.8.2</h1>
  <p id="summary">Uruchamianie testów…</p>
  <div class="grid"><iframe id="app" src="index.html?v=5.8.2"></iframe><section id="results"></section></div>
</main>
<script>
'use strict';
const frame=document.getElementById('app'),results=document.getElementById('results'),summary=document.getElementById('summary');
function add(name,ok,detail=''){const row=document.createElement('div');row.className='result '+(ok?'pass':'fail');row.textContent=(ok?'PASS: ':'FAIL: ')+name+(detail?' — '+detail:'');results.appendChild(row);return ok;}
frame.addEventListener('load',()=>setTimeout(()=>{
  const w=frame.contentWindow,d=w.document,T=w.__trainerTests;let passed=0,total=0;
  const test=(name,condition,detail='')=>{total++;if(add(name,!!condition,detail))passed++;};
  try{
    test('aplikacja uruchamia się bez błędu',!!T&&!d.getElementById('errorBox').textContent);
    test('wersja programu',d.body.textContent.includes('5.8.2'));
    test('dolne menu ma cztery pozycje',d.querySelectorAll('.bottomnav .nav').length===4);
    test('główny przycisk jest widoczny',d.getElementById('startBtn').textContent.includes('Rozpocznij dzisiejszą naukę'));
    test('onboarding ma pięć kroków',d.querySelectorAll('.onboarding-step').length===5);
    test('tryby mają opisy',d.querySelectorAll('#todayScreen .mode-card span').length===6);
    test('ustawienia mają siedem sekcji',d.querySelectorAll('#settingsScreen .settings-section').length===7);
    test('podczas lekcji są liczniki',!!d.getElementById('lessonRemaining')&&!!d.getElementById('lessonCorrect'));
    test('jest ekran podsumowania',!!d.getElementById('sumAccuracy')&&!!d.getElementById('sumXp'));
    test('baza ma co najmniej 450 pozycji',T.WORDS.length>=450,String(T.WORDS.length));
    test('baza ma co najmniej 45 materiałów B2',T.WORDS.filter(x=>x.level==='B2').length>=45);
    test('dialogi mają co najmniej 8 pełnych rozmów',new Set(Object.values(T.DIALOGUE_SCENES).map(x=>x.conversation)).size>=8);
    test('dialogi mają poprawne tablice odpowiedzi',Object.values(T.DIALOGUE_SCENES).every(x=>Array.isArray(x.accepted)&&x.accepted.length>=2));
    test('polecenia dialogów są po polsku',Object.values(T.DIALOGUE_SCENES).every(x=>!/^Client:/i.test(x.promptPl||'')));
    test('dialogi zawierają wypowiedź klienta',Object.values(T.DIALOGUE_SCENES).every(x=>/^Client:/i.test(x.prompt||'')));
    test('wszystkie wpisy mają konkretną część mowy',T.WORDS.every(x=>x.grammar?.partOfSpeech&&x.grammar.partOfSpeech!=='słowo'));
    test('import odrzuca tekst zamiast liczby',(()=>{try{T.validateImportedState(JSON.stringify({version:'5.8.2',user:{xp:'10'}}));return false}catch(e){return true}})());
    test('jest natychmiastowa powtórka błędu',!!d.getElementById('retryBtn'));
    test('błędne fragmenty są podświetlane',T.diffMarkup('I go','I went').answer.includes('<mark>'));
    test('brak sztucznych przykładów',!T.WORDS.some(x=>(x.examples||[]).some(e=>/this word is useful/i.test(e.en))));
    test('losowanie tworzy kolejkę',T.practiceQueue('test').length>0);
    test('dialogi tworzą kolejkę',T.practiceQueue('dialogues').length>0);
    test('tryb samochodowy tworzy kolejkę',T.practiceQueue('car').length>0);
    test('zły szyk nie jest zaliczany',T.answerScore('router the restart I','I restart the router').status==='wrong');
    test('import odrzuca ujemne XP',(()=>{try{T.validateImportedState(JSON.stringify({version:'5.8.2',user:{xp:-1}}));return false}catch(e){return true}})());
    test('daty są liczone kalendarzowo',T.addDays(1,'2026-12-31')==='2027-01-01');
    test('import odrzuca nowszą poprawkę wersji',(()=>{try{T.validateImportedState(JSON.stringify({version:'5.8.99'}));return false}catch(e){return true}})());
    test('import odrzuca datę zapisaną słownie',(()=>{try{T.validateImportedState(JSON.stringify({version:'5.8.2',createdAt:'July 29, 2026'}));return false}catch(e){return true}})());
    test('import odrzuca niemożliwą datę',(()=>{try{T.validateImportedState(JSON.stringify({version:'5.8.2',createdAt:'2026-02-30T12:00:00Z'}));return false}catch(e){return true}})());
    const badFragments=['good morning how','the battery is','the wireless network is','the firmware update may','final price depends','needs permission to','is diagnosis','use payment'];
    const collocations=T.WORDS.flatMap(x=>x.collocations||[]).map(x=>T.normalize(x));
    test('kolokacje nie są uciętymi zdaniami',badFragments.every(x=>!collocations.includes(T.normalize(x))));
    test('przykłady dialogów mają kontekst',T.WORDS.filter(x=>T.DIALOGUE_SCENES[x.id]).every(x=>x.examples?.[0]?.en?.includes('Client:')));
  }catch(error){add('wykonanie zestawu testów',false,error.message);total++;}
  summary.textContent=`Wynik: ${passed}/${total}`;summary.style.fontWeight='800';summary.style.color=passed===total?'#166534':'#991b1b';
},700));
</script></body></html>
