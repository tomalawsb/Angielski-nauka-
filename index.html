<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Angielski PWA v2.0</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon-192.png">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Angielski PWA</h1>
      <p>Fiszki, testy, powtórki i własne słówka</p>
    </div>
    <span class="version">v2.0</span>
  </header>

  <main class="app">
    <section class="panel controls">
      <label>
        Kategoria
        <select id="categorySelect"></select>
      </label>

      <label>
        Tryb nauki
        <select id="modeSelect">
          <option value="flashcards">Fiszki</option>
          <option value="choice">Test wyboru</option>
          <option value="typing">Wpisywanie odpowiedzi</option>
          <option value="mistakes">Powtórka błędów</option>
          <option value="hard">Trudne słówka</option>
        </select>
      </label>

      <label>
        Kierunek
        <select id="directionSelect">
          <option value="en-pl">Angielski → Polski</option>
          <option value="pl-en">Polski → Angielski</option>
        </select>
      </label>

      <label>
        Cel dzienny
        <input id="dailyGoalInput" type="number" min="1" max="999" value="20">
      </label>

      <div class="button-row control-buttons">
        <button id="startBtn">Start</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </section>

    <section class="panel stats">
      <div><strong id="doneCount">0</strong><span>łącznie</span></div>
      <div><strong id="todayCount">0</strong><span>dzisiaj</span></div>
      <div><strong id="goodCount">0</strong><span>dobrze</span></div>
      <div><strong id="badCount">0</strong><span>błędy</span></div>
      <div><strong id="accuracyCount">0%</strong><span>skuteczność</span></div>
    </section>

    <section class="panel daily-panel">
      <div class="daily-head">
        <strong>Cel dzienny</strong>
        <span id="dailyGoalText">0 / 20</span>
      </div>
      <div class="progress-track"><div id="dailyProgressBar" class="progress-bar"></div></div>
    </section>

    <section class="panel lesson">
      <div class="lesson-top">
        <span id="modeBadge" class="badge">Fiszki</span>
        <span id="progressInfo">0 / 0</span>
      </div>

      <div id="card" class="card">
        <div>
          <div id="question" class="question">Kliknij Start</div>
          <div id="answer" class="answer hidden"></div>
          <div id="example" class="example hidden"></div>
        </div>
      </div>

      <div id="choiceBox" class="choice-box hidden"></div>

      <div id="typingBox" class="typing-box hidden">
        <input id="typingInput" type="text" placeholder="Wpisz odpowiedź">
        <button id="checkTypingBtn">Sprawdź</button>
      </div>

      <p id="feedback" class="feedback"></p>

      <div class="button-row lesson-buttons">
        <button id="speakBtn" class="secondary">Wymowa</button>
        <button id="showAnswerBtn" class="secondary">Pokaż</button>
        <button id="wrongBtn" class="danger">Źle</button>
        <button id="rightBtn" class="success">Dobrze</button>
        <button id="hardBtn" class="warning">Trudne</button>
        <button id="nextBtn">Dalej</button>
      </div>
    </section>

    <section class="panel add-word">
      <h2>Własne słówka</h2>
      <div class="grid">
        <input id="newEnglish" type="text" placeholder="angielski, np. screwdriver">
        <input id="newPolish" type="text" placeholder="polski, np. śrubokręt">
        <input id="newCategory" type="text" placeholder="kategoria, np. narzędzia">
        <input id="newExample" type="text" placeholder="przykład, opcjonalnie">
        <button id="addWordBtn">Dodaj</button>
      </div>
      <div class="button-row data-buttons">
        <button id="exportBtn" class="secondary">Eksport danych</button>
        <button id="importBtn" class="secondary">Import danych</button>
        <button id="clearCustomBtn" class="danger">Usuń własne</button>
        <input id="importFile" type="file" accept="application/json" class="hidden">
      </div>
      <p class="hint">Dane zapisują się lokalnie w przeglądarce. Eksport zgrywa postępy i własne słówka do pliku JSON.</p>
    </section>

    <section class="panel word-list-panel">
      <div class="word-list-head">
        <h2>Lista słówek</h2>
        <input id="searchInput" type="search" placeholder="Szukaj słówka">
      </div>
      <div id="wordList" class="word-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
